name: Generate Snake

on:
  schedule:
    # Atualiza todos os dias à meia-noite
    - cron: "0 0 * * *" 
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: lsnbsb
          # Gera o arquivo SVG com a cobrinha azul e o fundo escuro
          outputs: |
            dist/github-snake.svg?color_snake=#2563EB&color_dots=#161B22,#1E3A8A,#2563EB,#3B82F6,#60A5FA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
