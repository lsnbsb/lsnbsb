name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: lsnbsb
          outputs: |
            github-snake.svg?color_snake=#2563EB&color_dots=#161B22,#1E3A8A,#2563EB,#3B82F6,#60A5FA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Commit and push
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Atualiza animação da cobrinha"
          branch: main
          file_pattern: github-snake.svg
